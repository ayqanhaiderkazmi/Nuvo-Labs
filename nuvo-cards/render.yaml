# Render Blueprint: creates the API and its Postgres database.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: nuvo-cards-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nuvo-cards-db
          property: connectionString
      - key: INITIAL_PASSWORD
        sync: false        # you type this in the dashboard; everyone starts with it, then changes it
      - key: FRONTEND_ORIGIN
        sync: false        # your Vercel URL, e.g. https://nuvo-cards.vercel.app
      - key: TEAM_TZ_OFFSET_MIN
        value: 300         # Pakistan is UTC+5. Used to decide which month a card belongs to.

databases:
  - name: nuvo-cards-db
    plan: free             # check Render's current free Postgres terms. For real data use a paid plan.
